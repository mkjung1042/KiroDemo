<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청년혜택 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1C1936;
    --paper: #F6F4FC;
    --card: #FFFFFE;
    --violet: #6B4EF0;
    --lime: #C8F169;
    --muted: #57536F;
    --line: #DDD7F3;
    --night: #26224A;
    --soft: #EEEAFB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
  }
  header {
    background: var(--ink);
    color: #F3F1FA;
    padding: 40px 20px 48px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  header .wrap { padding: 0; }
  .pill {
    display: inline-block;
    background: var(--lime);
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
  }
  header h1 {
    font-size: 40px;
    font-weight: 900;
    margin: 16px 0 8px;
    letter-spacing: -0.02em;
  }
  header p { margin: 0; font-size: 17px; color: #CFCBE6; }
  .hl { color: var(--lime); font-weight: 700; }

  main { padding: 28px 0 80px; }
  .section-title { font-size: 15px; font-weight: 700; color: var(--muted); margin: 0 0 12px; }

  .smart {
    background: var(--ink);
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .smart-title { font-size: 16px; font-weight: 700; color: #F3F1FA; margin: 0 0 4px; }
  .smart-title .ai { color: var(--lime); }
  .smart-desc { font-size: 13px; color: #A9A4C8; margin: 0 0 12px; }
  .smart-row { display: flex; gap: 8px; }
  .smart-row input { background: var(--night); border-color: #4A4570; color: #F3F1FA; }
  .smart-row input::placeholder { color: #8C87AE; }
  .smart-row input:focus { border-color: var(--lime); }
  .smart-row button {
    flex: none;
    background: var(--lime);
    color: var(--ink);
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
  }
  .smart-row button:disabled { opacity: .6; cursor: wait; }
  .smart-result { margin: 12px 0 0; font-size: 14px; color: var(--lime); min-height: 0; }
  .smart-result:empty { display: none; }
  .personas { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .persona-btn {
    border: 2px solid var(--violet);
    background: var(--card);
    color: var(--violet);
    border-radius: 999px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .persona-btn span { font-weight: 400; color: var(--muted); margin-left: 4px; }
  .persona-btn.active { background: var(--violet); color: #FFFFFE; }
  .persona-btn.active span { color: #E4DEFF; }

  .form-card {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 24px;
    padding: 24px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  input, select {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    padding: 12px 14px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
    color: var(--ink);
  }
  input:focus, select:focus { outline: none; border-color: var(--violet); }
  .full { grid-column: 1 / -1; }
  .primary-btn {
    width: 100%;
    margin-top: 20px;
    background: var(--violet);
    color: #FFFFFE;
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
  }
  .primary-btn:hover { filter: brightness(1.08); }

  #summary { margin: 36px 0 16px; font-size: 22px; font-weight: 700; }
  #summary .count { color: var(--violet); font-size: 36px; font-weight: 900; }
  .empty { color: var(--muted); font-size: 16px; font-weight: 400; }

  .card {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 24px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .card h3 { margin: 0; font-size: 20px; font-weight: 700; }
  .badge {
    flex: none;
    font-size: 13px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--violet);
    color: #FFFFFE;
    white-space: nowrap;
  }
  .badge.soon { background: var(--lime); color: var(--ink); }
  .badge.text { background: var(--soft); color: var(--violet); }
  .benefit { margin: 8px 0 16px; color: var(--muted); font-size: 15px; }
  .why {
    background: var(--soft);
    border-radius: 16px;
    padding: 14px 16px;
  }
  .why-title { font-size: 14px; font-weight: 700; color: var(--violet); margin-bottom: 4px; }
  .why-text { font-size: 15px; }
  .why-text.loading { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .link-btn, .alarm-btn {
    flex: 1;
    text-align: center;
    border-radius: 12px;
    padding: 11px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
  }
  .link-btn { border: 2px solid var(--violet); color: var(--violet); background: var(--card); }
  .alarm-btn { border: 2px solid var(--ink); background: var(--ink); color: #FFFFFE; }

  .ask { margin-top: 16px; border-top: 2px dashed var(--line); padding-top: 16px; }
  .ask-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    border-radius: 999px;
    padding: 6px 12px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .ask-row { display: flex; gap: 8px; }
  .ask-row input { font-size: 15px; padding: 10px 12px; }
  .ask-row button {
    flex: none;
    background: var(--violet);
    color: #FFFFFE;
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  .bubbles { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .q {
    align-self: flex-end;
    background: var(--soft);
    color: var(--ink);
    border-radius: 14px 14px 4px 14px;
    padding: 8px 12px;
    font-size: 14px;
    max-width: 85%;
  }
  .a {
    align-self: flex-start;
    background: var(--night);
    color: #F3F1FA;
    border-radius: 14px 14px 14px 4px;
    padding: 10px 14px;
    font-size: 14px;
    max-width: 90%;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--lime);
    font-weight: 700;
    padding: 12px 20px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
    header h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <span class="pill">Built with Kiro · Powered by AWS</span>
    <h1>청년혜택 찾기</h1>
    <p>5가지만 입력하면, 내가 받을 수 있는 <span class="hl">청년 혜택</span>을 찾아드려요</p>
  </div>
</header>

<main class="wrap">
  <section class="smart">
    <p class="smart-title"><span class="ai">AI</span>에게 한 문장으로 말해보세요</p>
    <p class="smart-desc">나이, 지역, 소득, 일, 사는 곳을 편하게 써 주시면 조건을 알아서 채워드려요</p>
    <div class="smart-row">
      <input type="text" id="smart-input" maxlength="300" placeholder="예: 27살이고 서울에서 월세 사는 직장인이야. 연봉은 3천">
      <button type="button" id="smart-btn">찾기</button>
    </div>
    <p class="smart-result" id="smart-result"></p>
  </section>

  <p class="section-title">예시로 체험해보기</p>
  <div class="personas" id="personas"></div>

  <form class="form-card" id="form">
    <div class="grid">
      <div>
        <label for="age">나이</label>
        <input type="number" id="age" min="15" max="80" placeholder="예: 27" required>
      </div>
      <div>
        <label for="region">지역</label>
        <select id="region">
          <option>서울</option><option>경기</option><option>인천</option><option>부산</option><option>기타</option>
        </select>
      </div>
      <div>
        <label for="income">연소득 (만원)</label>
        <input type="number" id="income" min="0" placeholder="예: 3000" required>
      </div>
      <div>
        <label for="employment">취업 상태</label>
        <select id="employment">
          <option>재직</option><option>구직</option><option>학생</option>
        </select>
      </div>
      <div class="full">
        <label for="housing">주거 형태</label>
        <select id="housing">
          <option>월세</option><option>전세</option><option>자가</option><option>부모님집</option>
        </select>
      </div>
    </div>
    <button type="submit" class="primary-btn">내 혜택 찾기</button>
  </form>

  <div id="summary"></div>
  <div id="results"></div>
</main>

<div id="toast"></div>

<script>
  // ④에게 받은 Lambda 함수 URL을 넣으세요. 비워두면 policies.json의 reason으로 표시해요.
  const API_URL = "";

  // 페르소나는 personas.json에서 불러와요. 파일이 없거나 실패하면 아래 기본값을 써요.
  let PERSONAS = [
    { name: "민지", desc: "입사 1년 차 직장인", age: 27, region: "서울", income: 3000, employment: "재직", housing: "월세" },
    { name: "준호", desc: "취업 준비생", age: 24, region: "경기", income: 0, employment: "구직", housing: "부모님집" },
    { name: "서연", desc: "자취하는 대학생", age: 22, region: "서울", income: 500, employment: "학생", housing: "월세" },
    { name: "태현", desc: "전세 사는 직장인", age: 31, region: "서울", income: 4500, employment: "재직", housing: "전세" },
    { name: "도윤", desc: "지방 사회초년생", age: 29, region: "부산", income: 1800, employment: "재직", housing: "월세" }
  ];
  const EXAMPLE_QUESTIONS = ["신청하려면 뭐가 필요해?", "언제까지 신청해?"];
  const DEFAULT_REASON = "나이·지역·소득 조건이 일치합니다.";

  let policies = [];
  let currentUser = null;
  let currentMatches = [];

  const $ = (id) => document.getElementById(id);

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), 2000);
  }

  function deadlineBadge(deadline) {
    if (/^\d{4}-\d{2}-\d{2}$/.test(deadline || "")) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const days = Math.round((new Date(deadline + "T00:00:00") - today) / 86400000);
      if (days < 0) return '<span class="badge text">마감</span>';
      const label = days === 0 ? "D-DAY" : "D-" + days;
      return `<span class="badge${days <= 7 ? " soon" : ""}">${label}</span>`;
    }
    return `<span class="badge text">${esc(deadline || "공고 확인")}</span>`;
  }

  function matches(user, p) {
    const ageOk = user.age >= p.minAge && user.age <= p.maxAge;
    const regionOk = (p.regions || []).includes("전국") || (p.regions || []).includes(user.region);
    const incomeOk = p.maxIncome === null || p.maxIncome === undefined || user.income <= p.maxIncome;
    const empOk = (p.employment || []).includes(user.employment);
    const houseOk = (p.housing || []).includes(user.housing);
    return ageOk && regionOk && incomeOk && empOk && houseOk;
  }

  async function postApi(body) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  function renderPersonas() {
    $("personas").innerHTML = PERSONAS.map((p, i) =>
      `<button type="button" class="persona-btn" data-i="${i}">${esc(p.name)}<span>${esc(p.desc)}</span></button>`
    ).join("");
    $("personas").addEventListener("click", (e) => {
      const btn = e.target.closest(".persona-btn");
      if (!btn) return;
      const p = PERSONAS[btn.dataset.i];
      document.querySelectorAll(".persona-btn").forEach((b) => b.classList.toggle("active", b === btn));
      $("age").value = p.age;
      $("region").value = p.region;
      $("income").value = p.income;
      $("employment").value = p.employment;
      $("housing").value = p.housing;
      search();
    });
  }

  function renderResults() {
    const list = currentMatches;
    $("summary").innerHTML = list.length
      ? `<span class="count">${list.length}</span>개의 혜택을 받을 수 있어요`
      : `조건에 맞는 혜택을 찾지 못했어요<br><span class="empty">나이나 소득 조건을 다시 확인해 주세요.</span>`;

    $("results").innerHTML = list.map((p) => `
      <article class="card" data-id="${esc(p.id)}">
        <div class="card-top">
          <h3>${esc(p.name)}</h3>
          ${deadlineBadge(p.deadline)}
        </div>
        <p class="benefit">${esc(p.benefit)}</p>
        <div class="why">
          <div class="why-title">왜 나에게 해당될까요?</div>
          <div class="why-text loading">AI가 분석 중...</div>
        </div>
        <div class="actions">
          <a class="link-btn" href="${esc(p.url)}" target="_blank" rel="noopener">신청 페이지</a>
          <button type="button" class="alarm-btn">마감 알림 받기</button>
        </div>
        <div class="ask">
          <div class="ask-title">이 정책, 더 물어보기</div>
          <div class="chips">
            ${EXAMPLE_QUESTIONS.map((q) => `<button type="button" class="chip">${esc(q)}</button>`).join("")}
          </div>
          <div class="ask-row">
            <input type="text" class="ask-input" placeholder="궁금한 점을 입력하세요">
            <button type="button" class="ask-btn">질문</button>
          </div>
          <div class="bubbles"></div>
        </div>
      </article>
    `).join("");
  }

  function setReason(id, text) {
    const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
    if (!card) return;
    const el = card.querySelector(".why-text");
    el.textContent = text;
    el.classList.remove("loading");
  }

  // AI 설명을 못 받았을 때: 입력값으로 맞는 조건을 문장으로 만들어요 (어떤 페르소나든 정확하게 나와요)
  function fallbackReason(p) {
    const u = currentUser;
    if (!u) return DEFAULT_REASON;
    const parts = [`만 ${p.minAge}~${p.maxAge}세 기준에 ${u.age}세가 해당`];
    if (!(p.regions || []).includes("전국")) parts.push(`${u.region} 거주 조건 충족`);
    if (p.maxIncome !== null && p.maxIncome !== undefined) parts.push(`연소득 ${p.maxIncome.toLocaleString()}만 원 이하 조건 충족`);
    if ((p.housing || []).length < 4) parts.push(`${u.housing} 거주 조건 충족`);
    return parts.join(", ") + "해요. 세부 요건은 신청 페이지에서 확인해 주세요.";
  }

  async function loadReasons() {
    const fallback = () => currentMatches.forEach((p) => setReason(p.id, fallbackReason(p)));
    if (!API_URL || !currentMatches.length) return fallback();
    try {
      const data = await postApi({ mode: "explain", user: currentUser, policies: currentMatches });
      const byId = {};
      (data.results || []).forEach((r) => { byId[r.id] = r.reason; });
      currentMatches.forEach((p) => setReason(p.id, byId[p.id] || fallbackReason(p)));
    } catch (err) {
      console.error(err);
      fallback();
    }
  }

  async function ask(card, question) {
    question = question.trim();
    if (!question) return;
    const policy = currentMatches.find((p) => p.id === card.dataset.id);
    const bubbles = card.querySelector(".bubbles");
    bubbles.insertAdjacentHTML("beforeend", `<div class="q">${esc(question)}</div>`);
    const answer = document.createElement("div");
    answer.className = "a";
    answer.textContent = "답변 작성 중...";
    bubbles.appendChild(answer);

    if (!API_URL) {
      answer.textContent = policy.detail || "정확한 내용은 신청 페이지에서 확인해 주세요.";
      return;
    }
    try {
      const data = await postApi({ mode: "ask", user: currentUser, policy, question });
      answer.textContent = data.answer || "지금은 답변이 어려워요. 신청 페이지에서 확인해 주세요.";
    } catch (err) {
      console.error(err);
      answer.textContent = "지금은 답변이 어려워요. 신청 페이지에서 확인해 주세요.";
    }
  }

  function search() {
    const age = parseInt($("age").value, 10);
    const income = parseInt($("income").value, 10);
    if (Number.isNaN(age) || Number.isNaN(income)) {
      toast("나이와 연소득을 입력해 주세요");
      return;
    }
    currentUser = {
      age, income,
      region: $("region").value,
      employment: $("employment").value,
      housing: $("housing").value
    };
    currentMatches = policies.filter((p) => matches(currentUser, p));
    renderResults();
    loadReasons();
    $("summary").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  $("form").addEventListener("submit", (e) => { e.preventDefault(); search(); });
  $("form").addEventListener("input", () => {
    document.querySelectorAll(".persona-btn").forEach((b) => b.classList.remove("active"));
  });

  // ===== 한 문장으로 검색 =====
  // AI(Lambda mode: "parse")가 실패하거나 API_URL이 없으면 간단한 규칙으로 뽑아요.
  function localParse(text) {
    const t = text.replace(/\s+/g, " ");
    const user = { age: null, region: null, income: null, employment: null, housing: null };

    const age = t.match(/(\d{2})\s*(살|세)/);
    if (age) user.age = parseInt(age[1], 10);

    if (/서울/.test(t)) user.region = "서울";
    else if (/경기|수원|성남|용인|고양|부천|안양|화성|분당|일산/.test(t)) user.region = "경기";
    else if (/인천/.test(t)) user.region = "인천";
    else if (/부산/.test(t)) user.region = "부산";
    else if (/대구|광주|대전|울산|세종|강원|충북|충남|전북|전남|경북|경남|제주|지방/.test(t)) user.region = "기타";

    const monthly = t.match(/월\s*(?:급|소득|수입)?\s*(?:은|이|는)?\s*(\d+)\s*만/);
    const thousand = t.match(/(\d+(?:\.\d+)?)\s*천/);
    const manwon = t.match(/(\d{3,5})\s*만/);
    if (/소득\s*(?:이|은)?\s*없|수입\s*(?:이|은)?\s*없|무직|백수/.test(t)) user.income = 0;
    else if (monthly) user.income = parseInt(monthly[1], 10) * 12;
    else if (thousand) user.income = Math.round(parseFloat(thousand[1]) * 1000);
    else if (manwon) user.income = parseInt(manwon[1], 10);

    if (/취준|취업\s*준비|구직|백수|무직|일\s*(?:을|자리)?\s*(?:구하|찾)/.test(t)) user.employment = "구직";
    else if (/대학|학생|휴학|대학원/.test(t)) user.employment = "학생";
    else if (/직장|회사|재직|근무|일하|알바|사회\s*초년|사원|다니/.test(t)) user.employment = "재직";

    if (/월세/.test(t)) user.housing = "월세";
    else if (/전세/.test(t)) user.housing = "전세";
    else if (/부모|본가|엄마|아빠/.test(t)) user.housing = "부모님집";
    else if (/자가|내\s*집|집\s*(?:이|을)?\s*(?:있|샀)/.test(t)) user.housing = "자가";

    if (user.income === null && user.employment && user.employment !== "재직") user.income = 0;
    return user;
  }

  const FIELD_LABELS = { age: "나이", region: "지역", income: "연소득", employment: "취업 상태", housing: "주거 형태" };

  async function smartSearch() {
    const text = $("smart-input").value.trim();
    if (!text) { toast("상황을 한 문장으로 입력해 주세요"); return; }
    const btn = $("smart-btn");
    btn.disabled = true;
    btn.textContent = "분석 중";
    $("smart-result").textContent = "";

    let parsed = null;
    let byAI = false;
    if (API_URL) {
      try {
        const data = await postApi({ mode: "parse", text });
        if (data && data.user) { parsed = data.user; byAI = true; }
      } catch (err) { console.error(err); }
    }
    const local = localParse(text);
    if (!parsed) parsed = local;
    else Object.keys(local).forEach((k) => { if (parsed[k] === null || parsed[k] === undefined) parsed[k] = local[k]; });

    btn.disabled = false;
    btn.textContent = "찾기";
    document.querySelectorAll(".persona-btn").forEach((b) => b.classList.remove("active"));

    if (parsed.age !== null) $("age").value = parsed.age;
    if (parsed.region !== null) $("region").value = parsed.region;
    if (parsed.income !== null) $("income").value = parsed.income;
    if (parsed.employment !== null) $("employment").value = parsed.employment;
    if (parsed.housing !== null) $("housing").value = parsed.housing;

    const missing = Object.keys(FIELD_LABELS).filter((k) => parsed[k] === null || parsed[k] === undefined);
    const known = [
      parsed.age !== null ? parsed.age + "세" : null,
      parsed.region,
      parsed.income !== null ? "연 " + Number(parsed.income).toLocaleString() + "만 원" : null,
      parsed.employment,
      parsed.housing
    ].filter((v) => v !== null && v !== undefined);
    $("smart-result").textContent = (byAI ? "AI가 이렇게 이해했어요: " : "이렇게 이해했어요: ") + (known.join(" · ") || "조건을 찾지 못했어요");

    const mustHave = missing.filter((k) => k === "age" || k === "income");
    if (mustHave.length) {
      toast(mustHave.map((k) => FIELD_LABELS[k]).join(", ") + "을(를) 아래에 입력해 주세요");
      $("summary").innerHTML = "";
      $("results").innerHTML = "";
      $(mustHave[0]).focus();
      return;
    }
    if (missing.length) toast(missing.map((k) => FIELD_LABELS[k]).join(", ") + "은(는) 기본값으로 찾았어요");
    search();
  }

  $("smart-btn").addEventListener("click", smartSearch);
  $("smart-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); smartSearch(); }
  });

  $("results").addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    if (e.target.classList.contains("alarm-btn")) toast("알림이 신청되었어요");
    if (e.target.classList.contains("chip")) ask(card, e.target.textContent);
    if (e.target.classList.contains("ask-btn")) {
      const input = card.querySelector(".ask-input");
      ask(card, input.value);
      input.value = "";
    }
  });

  $("results").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.classList.contains("ask-input") && !e.isComposing) {
      e.preventDefault();
      const card = e.target.closest(".card");
      ask(card, e.target.value);
      e.target.value = "";
    }
  });

  async function init() {
    try {
      const res = await fetch("personas.json");
      const data = await res.json();
      if (Array.isArray(data) && data.length) PERSONAS = data;
    } catch (err) {
      console.warn("personas.json을 불러오지 못해 기본 페르소나를 사용해요.", err);
    }
    renderPersonas();
    try {
      const res = await fetch("policies.json");
      policies = await res.json();
    } catch (err) {
      console.error(err);
      $("summary").innerHTML = '<span class="empty">정책 데이터를 불러오지 못했어요. 로컬 서버(python3 -m http.server)로 열었는지 확인해 주세요.</span>';
    }
  }
  init();
</script>
